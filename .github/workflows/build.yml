name: Build and Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Upstream reF1nd tag to build"
        required: true
        type: string

concurrency:
  group: build-${{ github.event_name }}-${{ inputs.source_tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
      source_tag: ${{ steps.setup.outputs.source_tag }}
      asset_version: ${{ steps.setup.outputs.asset_version }}
      release_tag: ${{ steps.setup.outputs.release_tag }}
      prerelease: ${{ steps.setup.outputs.prerelease }}
      cronet_version: ${{ steps.metadata.outputs.cronet_version }}
    steps:
      - name: Validate input
        id: setup
        run: |
          set -euo pipefail
          SOURCE_TAG='${{ inputs.source_tag }}'
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?-reF1nd(\.[0-9]+)?$ ]]; then
            echo "Invalid source tag: ${SOURCE_TAG}" >&2
            exit 1
          fi
          ASSET_VERSION="${SOURCE_TAG#v}"
          VERSION="${ASSET_VERSION%-reF1nd*}"
          RELEASE_TAG="v${VERSION}"
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "source_tag=${SOURCE_TAG}"
            echo "asset_version=${ASSET_VERSION}"
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ steps.setup.outputs.source_tag }}
          fetch-depth: 0

      - name: Extract build metadata
        id: metadata
        run: |
          set -euo pipefail
          CRONET_VERSION=$(cat .github/CRONET_GO_VERSION)
          echo "cronet_version=${CRONET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Cronet version: ${CRONET_VERSION}"

          echo "Build tags: $(cat release/DEFAULT_BUILD_TAGS)"
          echo "LDFLAGS: $(cat release/LDFLAGS)"

  build_linux:
    name: Linux ${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ubuntu-26.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              arch: amd64,
              goarch: amd64,
              goamd64: v1,
              variant: purego,
              cgo: "0",
            }
          - {
              arch: amd64,
              goarch: amd64,
              goamd64: v1,
              variant: glibc,
              cgo: "1",
            }
          - {
              arch: amd64,
              goarch: amd64,
              goamd64: v1,
              variant: musl,
              cgo: "1",
              debian: amd64,
              rpm: x86_64,
              pacman: x86_64,
            }
          - {
              arch: amd64v3,
              goarch: amd64,
              goamd64: v3,
              variant: purego,
              cgo: "0",
            }
          - {
              arch: amd64v3,
              goarch: amd64,
              goamd64: v3,
              variant: glibc,
              cgo: "1",
            }
          - {
              arch: amd64v3,
              goarch: amd64,
              goamd64: v3,
              variant: musl,
              cgo: "1",
              debian: amd64,
              rpm: x86_64,
              pacman: x86_64,
            }
          - {
              arch: arm64,
              goarch: arm64,
              goamd64: "",
              variant: purego,
              cgo: "0",
            }
          - {
              arch: arm64,
              goarch: arm64,
              goamd64: "",
              variant: glibc,
              cgo: "1",
            }
          - {
              arch: arm64,
              goarch: arm64,
              goamd64: "",
              variant: musl,
              cgo: "1",
              debian: arm64,
              rpm: aarch64,
              pacman: aarch64,
            }
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.prepare.outputs.source_tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION='${{ needs.prepare.outputs.cronet_version }}'
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ '${{ matrix.variant }}' == 'musl' ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl download-toolchain
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} download-toolchain
          fi

      - name: Set Chromium toolchain environment
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ '${{ matrix.variant }}' == 'musl' ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl env >> "$GITHUB_ENV"
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} env >> "$GITHUB_ENV"
          fi

      - name: Set build tags
        run: |
          set -xeuo pipefail
          TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          if [[ '${{ matrix.variant }}' == 'purego' ]]; then
            TAGS="${TAGS},with_purego"
          elif [[ '${{ matrix.variant }}' == 'musl' ]]; then
            TAGS="${TAGS},with_musl"
          fi
          if [[ -d common/ebpf && ",${TAGS}," != *",with_ebpf,"* ]]; then
            TAGS="${TAGS},with_ebpf"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"

      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.prepare.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Extract libcronet.so
        if: matrix.variant == 'purego'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/linux_${{ matrix.goarch }}/libcronet.so"
          git init "$RUNNER_TEMP/cronet-go-lib"
          git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/

      - name: Set name and package version
        run: |
          DIR_NAME="sing-box-${{ needs.prepare.outputs.asset_version }}-linux-${{ matrix.arch }}"
          if [[ '${{ matrix.variant }}' == 'glibc' ]]; then
            DIR_NAME="${DIR_NAME}-glibc"
          elif [[ '${{ matrix.variant }}' == 'musl' ]]; then
            DIR_NAME="${DIR_NAME}-musl"
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"

          PKG_VERSION="${{ needs.prepare.outputs.version }}"
          PKG_VERSION="${PKG_VERSION//-/\~}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"

      - name: Archive binary
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          if [ -f libcronet.so ]; then
            cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"

      - name: Install packaging tools
        if: matrix.debian != '' && matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools

      - name: Package DEB
        if: matrix.debian != '' && matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          cp .fpm_systemd .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.prepare.outputs.asset_version }}_linux_${{ matrix.arch == 'amd64v3' && 'amd64v3' || matrix.debian }}.deb" \
            --architecture ${{ matrix.debian }} \
            dist/sing-box=/usr/bin/sing-box

      - name: Package RPM
        if: matrix.rpm != '' && matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          cp .fpm_systemd .fpm
          echo '%_rpmformat 4' > "$HOME/.rpmmacros"
          fpm -t rpm \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.prepare.outputs.asset_version }}_linux_${{ matrix.arch == 'amd64v3' && 'x86_64_v3' || matrix.rpm }}.rpm" \
            --architecture ${{ matrix.rpm }} \
            dist/sing-box=/usr/bin/sing-box

      - name: Package Pacman
        if: matrix.pacman != '' && matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          cp .fpm_pacman .fpm
          fpm -t pacman \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ needs.prepare.outputs.asset_version }}_linux_${{ matrix.arch == 'amd64v3' && 'x86_64_v3' || matrix.pacman }}.pkg.tar.zst" \
            --architecture ${{ matrix.pacman }} \
            dist/sing-box=/usr/bin/sing-box

      - name: Cleanup
        run: |
          rm -f dist/sing-box
          rm -f dist/libcronet.so

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: dist/

  build_windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, goarch: amd64, goamd64: v1 }
          - { arch: amd64v3, goarch: amd64, goamd64: v3 }
          - { arch: arm64, goarch: arm64, goamd64: "" }
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.prepare.outputs.source_tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: |
          if (Test-Path release/DEFAULT_BUILD_TAGS_WINDOWS) {
            $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
          } else {
            $TAGS = Get-Content release/DEFAULT_BUILD_TAGS
          }
          $LDFLAGS_SHARED = Get-Content release/LDFLAGS
          New-Item -ItemType Directory -Force -Path dist
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.prepare.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Clone cronet-go
        run: |
          $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
          git init $HOME/cronet-go
          git -C $HOME/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C $HOME/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C $HOME/cronet-go checkout FETCH_HEAD

      - name: Extract libcronet.dll
        run: |
          $env:CGO_ENABLED = "0"
          cd $HOME/cronet-go
          go run -v ./cmd/build-naive extract-lib --target windows/${{ matrix.goarch }} -o $env:GITHUB_WORKSPACE/dist

      - name: Archive
        run: |
          $DIR_NAME = "sing-box-${{ needs.prepare.outputs.asset_version }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$DIR_NAME"
          Copy-Item LICENSE "dist/$DIR_NAME"
          Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
          if (Test-Path "dist/libcronet.dll") {
            Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME"
          }
          Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
          Remove-Item -Recurse "dist/$DIR_NAME"

      - name: Cleanup
        run: |
          Remove-Item dist/sing-box.exe -ErrorAction SilentlyContinue
          Remove-Item dist/libcronet.dll -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/

  build_darwin:
    name: Darwin ${{ matrix.arch }}
    runs-on: macos-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, goarch: amd64, goamd64: v1 }
          - { arch: amd64v3, goarch: amd64, goamd64: v3 }
          - { arch: arm64, goarch: arm64, goamd64: "" }
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.prepare.outputs.source_tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set build tags and ldflags
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.prepare.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set name
        run: |
          DIR_NAME="sing-box-${{ needs.prepare.outputs.asset_version }}-darwin-${{ matrix.arch }}"
          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"

      - name: Archive
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"

      - name: Cleanup
        run: rm -f dist/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build_linux
      - build_windows
      - build_darwin
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "All build artifacts:"
          find dist -type f -ls

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.source_tag }}
          RELEASE_BODY: Built from [reF1nd/sing-box@${{ needs.prepare.outputs.source_tag }}](https://github.com/reF1nd/sing-box/tree/${{ needs.prepare.outputs.source_tag }}).
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" -q '.id')
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate -q '.[].id' | while read -r ASSET_ID; do
              [ -n "$ASSET_ID" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" >/dev/null
            done
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f name="$RELEASE_TITLE" -f body="$RELEASE_BODY" -F draft=false -F prerelease="$PRERELEASE" >/dev/null
            gh release upload "$RELEASE_TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            ARGS=(release create "$RELEASE_TAG" dist/* --title "$RELEASE_TITLE" --notes "$RELEASE_BODY")
            if [[ "$PRERELEASE" == "true" ]]; then
              ARGS+=(--prerelease)
            fi
            gh "${ARGS[@]}" -R "$GITHUB_REPOSITORY"
          fi
